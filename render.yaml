# Render Infrastructure as Code Blueprint (render.yaml)
# https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Production Backend Web Service
  - type: web
    name: studiq-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: STUDIQ_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://studiq-frontend.onrender.com
      - key: STUDIQ_DATABASE_URL
        fromDatabase:
          name: studiq-db
          property: connectionString

  # 2. React Vite Production Frontend Static Site
  - type: web
    name: studiq-frontend
    env: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://studiq-backend.onrender.com/api/v1

databases:
  # 3. PostgreSQL Database Instance for Production Scale
  - name: studiq-db
    databaseName: studiq
    user: studiq_user
    plan: free
    region: oregon
